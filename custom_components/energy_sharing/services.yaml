process_now:
  name: Process now
  description: Attempt to process the latest eligible completed interval for the selected Energy Sharing device.
  target:
    device:
      integration: energy_sharing

reset_totals:
  name: Reset totals
  description: Reset all cumulative integration-owned energy totals and interval counters. Source cumulative sensors are not changed.
  target:
    device:
      integration: energy_sharing
  fields:
    confirm:
      name: Confirm reset
      description: Must be set to true to confirm resetting cumulative totals.
      required: true
      selector:
        boolean:

reinitialize_baseline:
  name: Reinitialize baseline
  description: Record current cumulative source totals as a fresh baseline and skip settlement for the partial current interval. Integration-owned cumulative totals are not reset.
  target:
    device:
      integration: energy_sharing

calibrate_loads:
  name: Calibrate / learn active loads
  description: Sequentially sample configured active loads to initialize measured-power estimates. Loads already ON are measured without being turned off.
  target:
    device:
      integration: energy_sharing

export_analysis_pack:
  name: Export analysis pack
  description: Write 15-minute settlement, daily donor energy, active-load, and next-month share CSVs to the Media folder (or config/energy_sharing_exports).
  target:
    device:
      integration: energy_sharing
  fields:
    period:
      name: Period
      description: Named range to export. Use custom together with start and end.
      default: last_month
      selector:
        select:
          translation_key: export_period
          options:
            - last_7_days
            - last_month
            - this_month
            - this_year
            - custom
          mode: dropdown
    start:
      name: Start
      description: Start of a custom export period (ignored unless period is custom).
      selector:
        datetime:
    end:
      name: End
      description: End of a custom export period (ignored unless period is custom).
      selector:
        datetime:
    target_month:
      name: Target month
      description: Optional Moj Elektro target month as YYYY-MM (defaults to next calendar month).
      example: "2026-11"
      selector:
        text:
