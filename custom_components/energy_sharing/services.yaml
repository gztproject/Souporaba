process_now:
  name: Process now
  description: Attempt to process the latest eligible completed interval for the selected Energy Sharing device.
  target:
    device:
      integration: energy_sharing

reset_totals:
  name: Reset totals
  description: Reset all cumulative integration-owned energy totals and interval counters. Source cumulative sensors are not changed.
  target:
    device:
      integration: energy_sharing
  fields:
    confirm:
      name: Confirm reset
      description: Must be set to true to confirm resetting cumulative totals.
      required: true
      selector:
        boolean:

reinitialize_baseline:
  name: Reinitialize baseline
  description: Record current cumulative source totals as a fresh baseline and skip settlement for the partial current interval. Integration-owned cumulative totals are not reset.
  target:
    device:
      integration: energy_sharing

calibrate_loads:
  name: Calibrate / learn active loads
  description: Sequentially sample configured active loads to initialize measured-power estimates. Loads already ON are measured without being turned off.
  target:
    device:
      integration: energy_sharing
